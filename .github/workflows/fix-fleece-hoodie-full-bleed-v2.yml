name: Fix Fleece Hoodie Full Bleed V2

on:
  push:
    paths:
      - '.github/workflows/fix-fleece-hoodie-full-bleed-v2.yml'
      - '.github/scripts/fix_fleece_hoodie_full_bleed_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Fleece Hoodie-only cutline patch
        run: python3 .github/scripts/fix_fleece_hoodie_full_bleed_v2.py

      - name: Verify JavaScript and Hoodie zones
        run: |
          node --check v20/editor.js
          node --check v20/fleece-hoodie-panels.js
          node tests/fleece-hoodie-zones.mjs

      - name: Confirm scope
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          for f in $changed; do
            case "$f" in
              v20/editor.js|tests/fleece-hoodie-zones.mjs) ;;
              *) echo "Unexpected file changed: $f"; exit 1 ;;
            esac
          done

      - name: Commit Fleece Hoodie-only changes
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js tests/fleece-hoodie-zones.mjs
          if git diff --cached --quiet; then
            echo 'Fleece Hoodie patch already applied.'
            exit 0
          fi
          git commit -m 'Fix Fleece Hoodie sleeve separation and full cutline fill'
          git push origin main
