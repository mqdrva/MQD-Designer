name: Install template-accurate 2D editor and clean 3D preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-v21-template-masks.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install v21 editor
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          payload = ''''''
          Path('v20/editor.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
      - name: Validate JavaScript
        run: node --check v20/editor.js
      - name: Commit v21 editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Use uploaded cut lines in 2D and decouple 3D mask"
          git push origin main
