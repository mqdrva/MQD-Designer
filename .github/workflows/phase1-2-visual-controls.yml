name: Add Phase 1 and 2 visual editing controls
on:
  push:
    paths:
      - 'scripts/phase1_2_patch.py'
      - '.github/workflows/phase1-2-visual-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/phase1_2_patch.py
      - name: Syntax check
        run: |
          cp v20/editor.js /tmp/editor.mjs
          node --check /tmp/editor.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v20/editor.js v20/editor.css
          git commit -m "Add visual crop resize nudge controls and align 2D 3D textures"
          git push
