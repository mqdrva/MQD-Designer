name: Add Phase 1 and 2 visual editing controls
on:
  push:
    paths:
      - 'scripts/layer_stack_patch.py'
      - '.github/workflows/phase1-2-visual-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layer stack patch
        run: python3 scripts/layer_stack_patch.py
      - name: Syntax check
        run: |
          cp v20/editor.js /tmp/editor.mjs
          node --check /tmp/editor.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Add draggable six-layer stacks per print zone"
          git push
