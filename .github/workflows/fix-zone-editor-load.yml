name: Fix zone editor load

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-zone-editor-load.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove broken reset tail
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad=""";designCtx.clearRect(0,0,2048,2048);designCtx.fillStyle='#ffffff';designCtx.fillRect(0,0,2048,2048);if(garment)garment.traverse(o=>{if(!o.isMesh)return;const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if('mqdOriginalMap' in m.userData)m.map=m.userData.mqdOriginalMap;m.needsUpdate=true})});const preview=$('previewImage'),empty=$('previewEmpty');if(preview){preview.removeAttribute('src');preview.style.display='none'}if(empty)empty.style.display='flex';designTexture.needsUpdate=true;layers=[];updateStats()};"""
          if bad not in s:
              raise SystemExit('Broken reset tail not found')
          s=s.replace(bad,'',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix zone editor page load"
          git push origin main
