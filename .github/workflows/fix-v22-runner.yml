name: Fix v22 workflow runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v22-runner.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wrap v22 patch in Python heredoc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/install-v22-uv-engine.yml')
          s=p.read_text()
          s=s.replace('        shell: python\n        run: |\n', "        shell: bash\n        run: |\n          python3 - <<'PYCODE'\n", 1)
          marker='      - name: Verify editor syntax\n'
          if marker not in s:
              raise SystemExit('Verify step marker not found')
          s=s.replace(marker, "          PYCODE\n"+marker, 1)
          p.write_text(s)
          PY
      - name: Commit runner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/install-v22-uv-engine.yml
          git commit -m "Fix v22 installer runner"
          git push origin main
