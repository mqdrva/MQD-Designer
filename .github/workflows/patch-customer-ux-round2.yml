name: Patch customer UX round 2

on:
  push:
    paths:
      - '.github/workflows/patch-customer-ux-round2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply editor UX patch
        run: python scripts/patch_customer_ux_round2.py
      - name: Check editor syntax
        run: node --check v20/editor.js
      - name: Commit editor UX improvements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v20/editor.js
          git commit -m "Improve 2D text visibility and customer print guidance" || exit 0
          git push origin HEAD:main
