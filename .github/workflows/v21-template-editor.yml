name: Apply v21 template editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-template-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upgrade 2D templates and 3D preview
        run: python .github/scripts/v21_patch.py
      - name: Verify JavaScript syntax
        run: node --check v20/editor.js
      - name: Commit v21
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Use production cut-line guides and clean 3D zone textures"
          git push origin main
