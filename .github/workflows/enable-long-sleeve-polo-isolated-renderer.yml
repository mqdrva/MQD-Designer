name: Apply Long Sleeve Polo isolation v2

on:
  push:
    paths:
      - '.github/workflows/enable-long-sleeve-polo-isolated-renderer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Long Sleeve Polo v2 patch
        run: python3 .github/scripts/fix_long_sleeve_polo_v2.py
      - name: Verify patch
        run: |
          node --check v20/editor.js
          node --check v20/long-sleeve-polo-panels.js
          grep -q "partitionLongSleevePoloTriangle" v20/editor.js
          grep -q "isolated-long-sleeve-polo-v2-exclusive-zones" v20/editor.js
          grep -q "product.id==='long-sleeve-polo'&&zone==='Back'" v20/editor.js
      - name: Commit Long Sleeve Polo fix
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js v20/long-sleeve-polo-panels.js
          if git diff --cached --quiet; then
            echo 'Long Sleeve Polo v2 patch already applied.'
            exit 0
          fi
          git commit -m 'Fix Long Sleeve Polo zone isolation and back mask'
          git push origin main
