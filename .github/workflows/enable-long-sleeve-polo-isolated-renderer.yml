name: Apply shared cutline contrast patch
on:
  push:
    paths:
      - '.github/workflows/enable-long-sleeve-polo-isolated-renderer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep production cutlines visible on every fill color
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()
          old="""    if(rec.cutlineCanvas){
      targetCtx.save();
      targetCtx.globalAlpha=1;
      targetCtx.globalCompositeOperation='source-over';
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }
"""
          new="""    if(rec.cutlineCanvas){
      targetCtx.save();
      targetCtx.globalAlpha=1;
      targetCtx.globalCompositeOperation='source-over';
      // Preserve true-red production cut/sew lines while keeping them readable
      // over red, dark, or visually similar customer background colors.
      targetCtx.shadowColor='rgba(255,255,255,.98)';
      targetCtx.shadowBlur=5;
      targetCtx.shadowOffsetX=0;
      targetCtx.shadowOffsetY=0;
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.shadowBlur=0;
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }
"""
          if old not in s:
              if "targetCtx.shadowColor='rgba(255,255,255,.98)'" in s:
                  raise SystemExit(0)
              raise SystemExit('Production cutline draw block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify syntax and contrast patch
        run: |
          node --check v20/editor.js
          grep -q "targetCtx.shadowColor='rgba(255,255,255,.98)'" v20/editor.js
      - name: Commit shared editor fix
        run: |
          if git diff --quiet -- v20/editor.js; then
            echo 'Cutline contrast patch already present.'
            exit 0
          fi
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js
          git commit -m 'Keep 2D production cutlines visible on all colors'
          git push origin main
