name: Enable Long Sleeve Polo isolated renderer
on:
  push:
    paths:
      - '.github/workflows/enable-long-sleeve-polo-isolated-renderer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enable isolated renderer for Long Sleeve Polo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()

          marker="const MQD_SHORT_SLEEVE_POLO_CALIBRATION='isolated-short-sleeve-exact-collar-v3-back-artwork-alignment';"
          assert marker in s, 'Short Sleeve Polo calibration marker missing'
          if "MQD_LONG_SLEEVE_POLO_CALIBRATION" not in s:
              s=s.replace(marker,marker+"\n// Long Sleeve Polo Phase 1: inherit the frozen long-sleeve isolation logic.\nconst MQD_LONG_SLEEVE_POLO_CALIBRATION='isolated-long-sleeve-polo-phase1';",1)

          old=" const longSleeve=product.id==='long-sleeve-tshirt';\n const shortPolo=product.id==='short-sleeve-polo';"
          new=" const longSleeve=product.id==='long-sleeve-tshirt';\n const longSleevePolo=product.id==='long-sleeve-polo';\n const shortPolo=product.id==='short-sleeve-polo';"
          assert old in s, 'Long sleeve split anchor missing'
          s=s.replace(old,new,1)

          old=" const parts=longSleeve?partitionLongSleeveTriangle(triangle):useExactPoloCollar?(isPoloCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):useExactCollar?(isTshirtCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):partitionTriangle(triangle);"
          new=" const parts=(longSleeve||longSleevePolo)?partitionLongSleeveTriangle(triangle):useExactPoloCollar?(isPoloCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):useExactCollar?(isTshirtCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):partitionTriangle(triangle);"
          assert old in s, 'Panel partition anchor missing'
          s=s.replace(old,new,1)

          old="  for(let i=0;i<b.P.length;i+=3)b.UV.push(...(longSleeve?longSleevePanelUv:panelUv)(panelNames[zi],...b.P.slice(i,i+3),b));"
          new="  for(let i=0;i<b.P.length;i+=3)b.UV.push(...((longSleeve||longSleevePolo)?longSleevePanelUv:panelUv)(panelNames[zi],...b.P.slice(i,i+3),b));"
          assert old in s, 'Panel UV anchor missing'
          s=s.replace(old,new,1)

          old="function updateTshirtZoneTextures(){if(!['tshirt','long-sleeve-tshirt','short-sleeve-polo'].includes(product.id)||!tshirtZoneMeshes.size)return false;"
          new="function updateTshirtZoneTextures(){if(!['tshirt','long-sleeve-tshirt','short-sleeve-polo','long-sleeve-polo'].includes(product.id)||!tshirtZoneMeshes.size)return false;"
          assert old in s, 'Texture renderer anchor missing'
          s=s.replace(old,new,1)

          old="function rebuildGarmentPreview(){if(['tshirt','long-sleeve-tshirt','short-sleeve-polo'].includes(product.id)&&tshirtZoneMeshes.size){clearDecals();updateTshirtZoneTextures();return;}rebuildDecals();}"
          new="function rebuildGarmentPreview(){if(['tshirt','long-sleeve-tshirt','short-sleeve-polo','long-sleeve-polo'].includes(product.id)&&tshirtZoneMeshes.size){clearDecals();updateTshirtZoneTextures();return;}rebuildDecals();}"
          assert old in s, 'Preview renderer anchor missing'
          s=s.replace(old,new,1)

          old="if(['tshirt','long-sleeve-tshirt','short-sleeve-polo'].includes(product.id)){const source=findPrimaryMesh(garment);if(source)splitTshirtGeometry(source);}"
          new="if(['tshirt','long-sleeve-tshirt','short-sleeve-polo','long-sleeve-polo'].includes(product.id)){const source=findPrimaryMesh(garment);if(source)splitTshirtGeometry(source);}"
          assert old in s, 'Garment split anchor missing'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Verify syntax
        run: |
          node --check v20/editor.js
          grep -q "MQD_LONG_SLEEVE_POLO_CALIBRATION='isolated-long-sleeve-polo-phase1'" v20/editor.js
          grep -q "'long-sleeve-polo'" v20/editor.js
      - name: Commit calibration
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js
          git commit -m 'Enable isolated Long Sleeve Polo renderer'
          git push origin main
