name: Run v22 UV engine patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-v22-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract and run v22 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/install-v22-uv-engine.yml').read_text()
          start=src.index('        run: |\n')+len('        run: |\n')
          end=src.index('      - name: Verify editor syntax\n', start)
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/v22_patch.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/v22_patch.py
      - name: Verify editor syntax
        run: node --check v20/editor.js
      - name: Commit v22 editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Use exact template masks and UV material zones for T-shirt"
          git push origin main
