name: Frozen product regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-product-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/mqd-glbs
          key: ${{ runner.os }}-mqd-glbs-${{ hashFiles('tests/frozen-products.json') }}
      - run: npm ci
      - name: Verify all 12 frozen garments
        run: npm run test:launch
        env:
          MQD_GLB_CACHE_DIR: .cache/mqd-glbs

  cart-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: regression
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Halloween pricing and all checkout paths
        run: node tests/halloween-promotion.mjs
      - name: Verify mobile artwork upload and retry behavior
        run: node tests/mobile-guest-cart.mjs
      - name: Verify mobile artwork pinch gestures
        run: node tests/mobile-pinch.mjs
      - name: Verify multi-order checkout schema
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/checkout-session-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001220545_allow_multiple_orders_per_checkout_session.sql
          psql -v ON_ERROR_STOP=1 -f tests/checkout-session-sharing.sql
