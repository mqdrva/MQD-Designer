name: Frozen product regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-product-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/mqd-glbs
          key: ${{ runner.os }}-mqd-glbs-${{ hashFiles('tests/frozen-products.json') }}
      - run: npm ci
      - name: Verify all 12 frozen garments
        run: npm run test:launch
        env:
          MQD_GLB_CACHE_DIR: .cache/mqd-glbs

      - name: Verify Shirt Games privacy, proofs and sandbox boundaries
        run: node --test games/tests/*.test.mjs

  cart-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: regression
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify Everyday pricing, production uploads and guest cart
        run: |
          node tests/everyday-checkout-flow.mjs
          node tests/everyday-ui-flow.mjs
          node tests/everyday-contract.mjs
          node tests/everyday-render-package.mjs
      - name: Verify homepage media, sale visibility and service signup links
        run: |
          node tests/homepage-media.mjs
          node tests/landing-routing.mjs
      - name: Verify Halloween pricing and all checkout paths
        run: node tests/halloween-promotion.mjs
      - name: Verify mobile artwork upload and retry behavior
        run: node tests/mobile-guest-cart.mjs
      - name: Verify mobile artwork pinch gestures
        run: node tests/mobile-pinch.mjs
      - name: Verify multi-order checkout schema
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/checkout-session-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001220545_allow_multiple_orders_per_checkout_session.sql
          psql -v ON_ERROR_STOP=1 -f tests/checkout-session-sharing.sql

      - name: Verify template privacy and immutable versions in isolated Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/template-schema-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020164602_premade_design_templates.sql
          psql -v ON_ERROR_STOP=1 -f tests/template-schema.sql

      - name: Verify private team masters and bounded original-artwork saves
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/team-master-schema-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022213030_team_master_versions_and_production_capacity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024012500_team_master_save_timeout.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024023500_owner_garment_master_drafts.sql
          psql -v ON_ERROR_STOP=1 -f tests/team-master-database.sql
          psql -v ON_ERROR_STOP=1 -f tests/team-garment-master-database.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028080000_owner_master_binary_save.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-master-binary-save.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028205945_owner_master_chunked_save.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028211104_owner_master_staging_lock_permission.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-master-chunked-save.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-team-commerce-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261024134136_owner_saved_master_publish.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-team-commerce.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025041153_owner_organizer_billing.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-organizer-billing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025044233_duplicate_owner_team.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-team-duplicate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026165602_team_checkout_master_fingerprints.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027054347_team_checkout_read_cost.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-team-commerce.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-organizer-billing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027171643_team_checkout_projection_cache.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027173307_team_checkout_cache_read_permissions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027174930_team_checkout_business_projection.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027175809_team_checkout_small_publication.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027180829_team_checkout_projection_alias.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-team-commerce.sql
          psql -v ON_ERROR_STOP=1 -f tests/owner-organizer-billing.sql
          psql -v ON_ERROR_STOP=1 -f tests/team-checkout-master.sql
          node tests/team-garment-copy.mjs

      - name: Verify isolated print-shop subscriptions and onboarding
        run: |
          node tests/print-shop-subscription.mjs
          node tests/print-shop-subscription-webhook.mjs
          node tests/print-shop-paid-access.mjs
          node tests/print-shop-onboarding.mjs
          node tests/print-shop-admin-auth.mjs
          node tests/print-shop-billing.mjs
          node tests/print-shop-billing-webhook.mjs
          node tests/print-shop-management.mjs
          node tests/print-shop-logos.mjs
          node tests/print-shop-setup-simplification.mjs
          node tests/team-setup-options.mjs
          node tests/team-large-logo.mjs
          node tests/team-service.mjs
          node tests/owner-team-workspace.mjs
          node tests/team-masters.mjs
          node tests/team-brand-permissions.mjs
          psql -v ON_ERROR_STOP=1 -f tests/team-checkout-business.sql
          node tests/team-checkout-memory.mjs
          node tests/owner-test-session.mjs
          node tests/team-production-fonts.mjs
          node tests/team-master-transport.mjs
          node tests/owner-master-transport.mjs
          node tests/owner-master-binary-save.mjs
          node tests/team-production.mjs
          node tests/team-production-placement.mjs
