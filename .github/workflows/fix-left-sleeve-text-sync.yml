name: One-time left sleeve text sync fix
on:
  push:
    paths:
      - '.github/workflows/fix-left-sleeve-text-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch editor text layering and sleeve coordinate frame
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()
          old1="function makeCleanZoneDesignCanvas(zone,maxSide=1600){const ratio=zoneDesignAspect(zone);let w,h;if(ratio>=1){w=maxSide;h=Math.max(256,Math.round(maxSide/ratio));}else{h=maxSide;w=Math.max(256,Math.round(maxSide*ratio));}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';drawLayerStack(x,zone,{x:0,y:0,w,h});return c;}"
          new1="""function makeCleanZoneDesignCanvas(zone,maxSide=1600){
  const rec=ensureTemplateImage(zone),t=product.templates?.[zone],isTshirtSleeve=product.id==='tshirt'&&zone.includes('Sleeve');
  const ratio=isTshirtSleeve&&t?.width&&t?.height?t.width/t.height:zoneDesignAspect(zone);
  let w,h;if(ratio>=1){w=maxSide;h=Math.max(256,Math.round(maxSide/ratio));}else{h=maxSide;w=Math.max(256,Math.round(maxSide*ratio));}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  let b={x:0,y:0,w,h};
  if(isTshirtSleeve&&rec?.img&&rec?.bounds){const sw=rec.img.naturalWidth||rec.img.width,sh=rec.img.naturalHeight||rec.img.height;b=scaleBounds(rec.bounds,sw,sh,w,h);}
  drawLayerStack(x,zone,b);return c;
}"""
          if old1 not in s:
              raise SystemExit('makeCleanZoneDesignCanvas target not found')
          s=s.replace(old1,new1,1)

          old2="""    // Keep the familiar product-template details faint, but do not rely on
    // multiply blending for the red production seam lines.
    targetCtx.save();
    targetCtx.globalAlpha=.34;
    targetCtx.globalCompositeOperation='multiply';
    targetCtx.drawImage(rec.img,r.x,r.y,r.w,r.h);
    targetCtx.restore();"""
          new2="""    // Keep the helper artwork only while a zone is empty. Once the customer
    // adds artwork/text, their layers stay visually on top; red cut lines remain last.
    if(!zoneHasContent(activeZone)){
      targetCtx.save();
      targetCtx.globalAlpha=.34;
      targetCtx.globalCompositeOperation='multiply';
      targetCtx.drawImage(rec.img,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }"""
          if old2 not in s:
              raise SystemExit('template helper target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: node --check v20/editor.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v20/editor.js
          git commit -m "Sync left sleeve text between 2D and 3D" || exit 0
          git push origin HEAD:main
