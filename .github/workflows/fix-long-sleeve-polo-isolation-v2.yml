name: Fix Long Sleeve Polo Isolation V2

on:
  push:
    paths:
      - '.github/workflows/fix-long-sleeve-polo-isolation-v2.yml'
      - '.github/scripts/fix_long_sleeve_polo_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/fix_long_sleeve_polo_v2.py
      - name: Verify JavaScript
        run: |
          node --check v20/editor.js
          node --check v20/long-sleeve-polo-panels.js
      - name: Commit changes
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js v20/long-sleeve-polo-panels.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'Fix Long Sleeve Polo zone isolation and back mask'
          git push origin main
