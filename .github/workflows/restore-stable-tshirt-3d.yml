name: Restore stable T-shirt 3D renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-stable-tshirt-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore renderer
        run: python .github/scripts/restore_stable_tshirt.py
      - name: Verify JavaScript syntax
        run: node --check v20/editor.js
      - name: Commit restored renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Restore stable T-shirt 3D renderer" || exit 0
          git push
