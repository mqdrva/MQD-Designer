name: Restore stable T-shirt texture frame
on:
  push:
    paths:
      - '.github/workflows/restore-stable-tshirt-texture-frame.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only the stable T-shirt 3D texture frame
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('v20/editor.js')
          s=p.read_text()
          stable="""function makeCleanZoneDesignCanvas(zone,maxSide=1600){const ratio=zoneDesignAspect(zone);let w,h;if(ratio>=1){w=maxSide;h=Math.max(256,Math.round(maxSide/ratio));}else{h=maxSide;w=Math.max(256,Math.round(maxSide*ratio));}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';drawLayerStack(x,zone,{x:0,y:0,w,h});return c;}"""
          pattern=r"function makeCleanZoneDesignCanvas\(zone,maxSide=1600\)\{.*?\n\}"
          m=re.search(pattern,s,re.S)
          if not m:
              # Also support the older one-line form.
              pattern=r"function makeCleanZoneDesignCanvas\(zone,maxSide=1600\)\{.*?return c;\}"
              m=re.search(pattern,s,re.S)
          if not m: raise SystemExit('makeCleanZoneDesignCanvas function not found')
          s=s[:m.start()]+stable+s[m.end():]
          marker="const MQD_TSHIRT_RENDERER_LOCK='stable-v1';"
          lock="\n// LOCKED: 3D T-shirt zone textures must stay in the stable rectangular UV frame.\n// 2D template clipping/cropping is editor-only and must not redefine the 3D UV texture frame.\nconst MQD_TSHIRT_TEXTURE_FRAME_LOCK='stable-a8bc447';"
          if marker in s and 'MQD_TSHIRT_TEXTURE_FRAME_LOCK' not in s:
              s=s.replace(marker,marker+lock,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          cp v20/editor.js /tmp/editor.mjs
          node --check /tmp/editor.mjs
      - name: Commit stable texture frame
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Restore stable T-shirt 3D texture frame"
          git push
