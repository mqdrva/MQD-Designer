name: Fix front panel isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-front-panel-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply front panel isolation patch
        run: python .github/scripts/fix_front_panel_isolation.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate front background and collar zone"
          git push origin main
