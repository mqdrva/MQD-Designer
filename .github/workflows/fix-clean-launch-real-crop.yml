name: Fix clean launch and true crop
on:
  push:
    paths:
      - '.github/workflows/fix-clean-launch-real-crop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_clean_crop.py
      - run: cp v20/editor.js /tmp/editor.mjs && node --check /tmp/editor.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Fix clean T-shirt launch and true non-zoom crop"
          git push
