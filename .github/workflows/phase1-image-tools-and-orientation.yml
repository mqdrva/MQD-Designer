name: Phase 1 image tools and orientation fix
on:
  push:
    paths:
      - '.github/workflows/phase1-image-tools-and-orientation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor
        run: python3 .github/patch-image-tools.py
      - name: Syntax check
        run: |
          cp v20/editor.js /tmp/editor.mjs
          node --check /tmp/editor.mjs
          node --check v20/customer.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Fix image orientation and enable layer image tools"
          git push
