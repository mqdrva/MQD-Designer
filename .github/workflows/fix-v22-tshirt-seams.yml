name: Upgrade T-shirt continuous panel shader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v22-tshirt-seams.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace triangle zones with continuous panel shader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          def extract_function(src, name):
              marker=f'function {name}('
              start=src.find(marker)
              if start<0: raise SystemExit(f'Missing function in payload: {name}')
              brace=src.find('{',start)
              depth=0
              for i in range(brace,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[start:i+1]
              raise SystemExit(f'Could not parse payload function: {name}')

          def replace_function(src, name, new_code):
              marker=f'function {name}('
              start=src.find(marker)
              if start<0: raise SystemExit(f'Missing function: {name}')
              brace=src.find('{',start)
              depth=0
              for i in range(brace,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[:start]+new_code+src[i+1:]
              raise SystemExit(f'Could not parse function: {name}')

          installer=Path('.github/workflows/install-v23-panel-shader.yml').read_text()
          blobs=re.findall(r'base64\.b64decode\("([A-Za-z0-9+/=]+)"',installer)
          if len(blobs)<2: raise SystemExit(f'Encoded v23 payloads not found: {len(blobs)}')
          payload=base64.b64decode(blobs[0]).decode('utf-8')
          update_payload=base64.b64decode(blobs[1]).decode('utf-8')
          new_split=extract_function(payload,'splitTshirtGeometry')
          new_dispose=extract_function(payload,'disposeTshirtShaderState')
          new_update=extract_function(update_payload,'updateTshirtZoneTextures')

          p=Path('v20/editor.js')
          s=p.read_text()
          s=s.replace("const MQD_TSHIRT_ZONE_CALIBRATION='v22.1-collar-ring-sleeve-perspective';","const MQD_TSHIRT_ZONE_CALIBRATION='v23.0-single-mesh-panel-shader';")
          if "let tshirtShaderState=null;" not in s:
              s=s.replace("const tshirtZoneMeshes=new Map();\n","const tshirtZoneMeshes=new Map();\nlet tshirtShaderState=null;\n")
          s=replace_function(s,'splitTshirtGeometry',new_split)
          s=replace_function(s,'updateTshirtZoneTextures',new_update)
          if 'function disposeTshirtShaderState(' not in s:
              marker='function disposeZoneTexture('
              pos=s.find(marker)
              if pos<0: raise SystemExit('disposeZoneTexture marker missing')
              s=s[:pos]+new_dispose+'\n'+s[pos:]
          s=s.replace("function loadGarment(){if(!renderer)init3D();if(garment){","function loadGarment(){if(!renderer)init3D();disposeTshirtShaderState();if(garment){")
          p.write_text(s)
          PY

      - name: Verify editor syntax
        run: node --check v20/editor.js

      - name: Commit continuous panel engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/editor.js
          git commit -m "Use continuous panel shader for T-shirt zones" || exit 0
          git push
