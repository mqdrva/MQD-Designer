name: Fix Short Sleeve Polo collar isolation
on:
  push:
    paths:
      - '.github/workflows/fix-short-sleeve-polo-collar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only Short Sleeve Polo collar ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()

          old="import {TSHIRT_FACE_COUNT,isTshirtCollarFace} from './tshirt-collar-mask.js';"
          new="import {TSHIRT_FACE_COUNT,isTshirtCollarFace} from './tshirt-collar-mask.js';\nimport {POLO_FACE_COUNT,isPoloCollarFace} from './polo-collar-mask.js';"
          assert old in s, 'import anchor missing'
          s=s.replace(old,new,1)

          old=" const longSleeve=product.id==='long-sleeve-tshirt';"
          new=" const longSleeve=product.id==='long-sleeve-tshirt';\n const shortPolo=product.id==='short-sleeve-polo';"
          assert old in s, 'product flags anchor missing'
          s=s.replace(old,new,1)

          old=" const count=index?index.count:pos.count,faceCount=(count/3)|0,useExactCollar=!longSleeve&&faceCount===TSHIRT_FACE_COUNT;\n if(!longSleeve&&!useExactCollar)console.warn('MQD collar topology mask disabled: expected',TSHIRT_FACE_COUNT,'faces but found',faceCount);"
          new=" const count=index?index.count:pos.count,faceCount=(count/3)|0,useExactCollar=product.id==='tshirt'&&faceCount===TSHIRT_FACE_COUNT,useExactPoloCollar=shortPolo&&faceCount===POLO_FACE_COUNT;\n if(product.id==='tshirt'&&!useExactCollar)console.warn('MQD T-shirt collar topology mask disabled: expected',TSHIRT_FACE_COUNT,'faces but found',faceCount);\n if(shortPolo&&!useExactPoloCollar)console.warn('MQD Short Sleeve Polo collar topology mask disabled: expected',POLO_FACE_COUNT,'faces but found',faceCount);"
          assert old in s, 'collar count anchor missing'
          s=s.replace(old,new,1)

          old="  const parts=longSleeve?partitionLongSleeveTriangle(triangle):useExactCollar?(isTshirtCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):partitionTriangle(triangle);"
          new="  const parts=longSleeve?partitionLongSleeveTriangle(triangle):useExactPoloCollar?(isPoloCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):useExactCollar?(isTshirtCollarFace(faceIndex)?[[4,triangle]]:partitionBodyTriangle(triangle)):partitionTriangle(triangle);"
          assert old in s, 'partition anchor missing'
          s=s.replace(old,new,1)

          old="const MQD_SHORT_SLEEVE_POLO_CALIBRATION='isolated-short-sleeve-reference-v1';"
          new="const MQD_SHORT_SLEEVE_POLO_CALIBRATION='isolated-short-sleeve-exact-collar-v2';"
          assert old in s, 'calibration anchor missing'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit targeted fix
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js
          git commit -m 'Give Short Sleeve Polo collar exclusive topology ownership'
          git push origin main
