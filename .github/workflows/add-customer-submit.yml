name: Install customer save and cart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-customer-submit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch customer save and cart flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          current='<div class="top-actions"><button id="downloadMockup" class="btn primary">Download Mockup PNG</button><button id="openAdmin" class="btn owner-only">Product Admin</button><button id="loadDesign" class="btn owner-only">Load Design</button><button id="saveDesign" class="btn owner-only">Save Design</button><button id="downloadPack" class="btn primary owner-only">Download Production ZIP</button></div>'
          upgraded='<div class="top-actions"><button id="saveDraft" class="btn">Save Design</button><button id="downloadMockup" class="btn">Download Mockup PNG</button><button id="addToCart" class="btn orange">Add to Cart</button><button id="cartButton" class="btn">Cart (0)</button><button id="openAdmin" class="btn owner-only">Product Admin</button><button id="loadDesign" class="btn owner-only">Load Design</button><button id="saveDesign" class="btn owner-only">Export Design JSON</button><button id="downloadPack" class="btn primary owner-only">Download Production ZIP</button></div>'
          if current in s:
              s=s.replace(current,upgraded,1)
          elif 'id="addToCart"' not in s:
              raise SystemExit('Customer top action marker not found')
          index.write_text(s,encoding='utf-8')

          p=Path('v20/editor.js')
          s=p.read_text(encoding='utf-8')
          anchor="$('downloadMockup').onclick=downloadMockupPNG;"
          if "const MQD_SUBMIT_URL=" not in s:
              insert=r'''
const MQD_SUBMIT_URL='https://gsxuhpffgdffsqksrkrf.supabase.co/functions/v1/submit-mqd-design';
const MQD_DRAFT_DB='mqd-customer-designs';
function openDraftDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(MQD_DRAFT_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('drafts'))req.result.createObjectStore('drafts');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function saveCustomerDraft(){const button=$('saveDraft'),old=button.textContent;button.disabled=true;button.textContent='Saving…';try{const db=await openDraftDB();await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readwrite');tx.objectStore('drafts').put(designJSON(),product.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});button.textContent='Saved ✓';setTimeout(()=>button.textContent=old,1300);}catch(e){console.error(e);button.textContent=old;alert('Design could not be saved on this device.');}finally{button.disabled=false;}}
async function restoreCustomerDraft(pid){try{const db=await openDraftDB(),payload=await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readonly'),req=tx.objectStore('drafts').get(pid);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});if(!payload?.design)return false;designs[pid]=payload.design;if(product.id===pid){activeZone=product.zones.includes(payload.activeZone)?payload.activeZone:product.zones[0];activeLayerId=zoneState().layers.at(-1)?.id||null;repairImageObjects();renderAll();}return true;}catch(e){console.warn('Draft restore failed',e);return false;}}
function currentMockupBlob(){return new Promise(resolve=>{if(!renderer||!garment)return resolve(null);renderer.render(scene,camera);const src=renderer.domElement,out=document.createElement('canvas');out.width=src.width;out.height=src.height;const c=out.getContext('2d');c.fillStyle='#F7F7F7';c.fillRect(0,0,out.width,out.height);c.drawImage(src,0,0);out.toBlob(resolve,'image/png');});}
function cartItems(){try{return JSON.parse(localStorage.getItem('mqd-cart')||'[]')}catch{return[]}}
function updateCartButton(){const b=$('cartButton');if(b)b.textContent='Cart ('+cartItems().length+')';}
async function submitCustomerDesign(){
 const payload=designJSON(),form=new FormData();
 form.append('payload',JSON.stringify(payload,(k,v)=>k==='src'||k==='image'?undefined:v));
 const mockup=await currentMockupBlob();if(mockup)form.append('mockup',mockup,product.id+'-mockup.png');
 for(const [zone] of Object.entries(payload.design.zones||{})){
  const live=stateFor().zones?.[zone];
  for(const layer of live?.layers||[]){
   if(layer.type!=='image'||!layer.src)continue;
   const blob=layer.src.startsWith('data:')?dataUrlBlob(layer.src):await fetch(layer.src).then(r=>{if(!r.ok)throw new Error('Could not prepare artwork');return r.blob();});
   form.append('asset',blob,layer.filename||'artwork.png');
   form.append('assetMeta',JSON.stringify({zone,layerId:layer.id,label:layer.label,x:layer.x||0,y:layer.y||0,scale:layer.scale||1,rotation:layer.rotation||0,visible:layer.visible!==false}));
  }
 }
 const response=await fetch(MQD_SUBMIT_URL,{method:'POST',body:form});
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok)throw new Error(result.error||'Design submission failed');
 return result;
}
$('saveDraft').onclick=saveCustomerDraft;
$('addToCart').onclick=async()=>{const b=$('addToCart'),old=b.textContent;b.disabled=true;b.textContent='Adding…';try{const result=await submitCustomerDesign(),cart=cartItems();cart.push({designId:result.designId,orderNumber:result.orderNumber,productId:product.id,productName:product.name,price:Number(product.price)||0,addedAt:new Date().toISOString()});localStorage.setItem('mqd-cart',JSON.stringify(cart));updateCartButton();b.textContent='Added ✓';setTimeout(()=>b.textContent=old,1300);}catch(e){console.error(e);b.textContent=old;alert('Could not add this design to cart: '+e.message);}finally{b.disabled=false;}};
$('cartButton').onclick=()=>{const cart=cartItems();if(!cart.length)return alert('Your cart is empty.');const total=cart.reduce((n,x)=>n+(Number(x.price)||0),0);alert(cart.map((x,i)=>`${i+1}. ${x.productName} — $${Number(x.price).toFixed(2)}\nRef: ${x.orderNumber}`).join('\n\n')+`\n\nSubtotal: $${total.toFixed(2)}\n\nCheckout will open here once Stripe is connected.`);};
updateCartButton();
setTimeout(()=>restoreCustomerDraft(product.id),500);
'''
              if anchor not in s: raise SystemExit('Mockup handler marker not found')
              s=s.replace(anchor,anchor+'\n'+insert,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check v20/editor.js

      - name: Commit customer save and cart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v20/editor.js
          git diff --cached --quiet && exit 0
          git commit -m "Add customer save design and cart flow"
          git push origin main
