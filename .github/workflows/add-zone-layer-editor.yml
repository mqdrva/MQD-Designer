name: Add zone layer editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-zone-layer-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch zone/layer editor
        run: python .github/scripts/patch_zone_editor.py
      - name: Commit editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add per-zone artwork layers and controls"
          git push origin main
