name: Fix 2D fill mask to red cut lines
on:
  push:
    paths:
      - '.github/workflows/fix-cutline-fill-mask.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build solid background masks from red cut lines only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()

          old="const blocked=new Uint8Array(w*h),outside=new Uint8Array(w*h),queue=new Int32Array(w*h);"
          new="const blocked=new Uint8Array(w*h),cutBarrier=new Uint8Array(w*h),outside=new Uint8Array(w*h),queue=new Int32Array(w*h);"
          assert old in s, 'mask array anchor missing'
          s=s.replace(old,new,1)

          old="""    blocked[p]=(a>15&&(lum<232||redInk))?1:0;
    if(redInk){"""
          new="""    blocked[p]=(a>15&&(lum<232||redInk))?1:0;
    cutBarrier[p]=redInk?1:0;
    if(redInk){"""
          assert old in s, 'red cutline detection anchor missing'
          s=s.replace(old,new,1)

          old="""  let barrier=blocked;
  for(let pass=0;pass<2;pass++){"""
          new="""  // The customer background must be defined by the RED production cut line,
  // not by helper words, green outlines or other template artwork. The cut line
  // is dashed, so close its small gaps before flooding from the page edge.
  let barrier=cutBarrier;
  const closePasses=Math.max(6,Math.min(14,Math.round(Math.min(w,h)*0.026)));
  for(let pass=0;pass<closePasses;pass++){"""
          assert old in s, 'barrier anchor missing'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Verify targeted fix
        run: |
          node --check v20/editor.js
          grep -q 'cutBarrier=new Uint8Array' v20/editor.js
          grep -q 'cutBarrier\[p\]=redInk?1:0' v20/editor.js
          grep -q 'let barrier=cutBarrier' v20/editor.js
          grep -q 'closePasses=' v20/editor.js
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-cutline-fill-mask.yml
          git add v20/editor.js
          git commit -m 'Fill 2D backgrounds inside red cut lines only'
          git push origin main
