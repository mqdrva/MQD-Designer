name: Install clean template editor v20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-template-editor-v20.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install template-first editor
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          index_b64 = ''''''
          js_b64 = ''''''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(index_b64)))
          Path('v20').mkdir(exist_ok=True)
          Path('v20/editor.js').write_bytes(gzip.decompress(base64.b64decode(js_b64)))
      - name: Commit editor refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v20/editor.js v20/editor.css
          git commit -m "Refactor designer to template-first editor" || exit 0
          git push origin main
