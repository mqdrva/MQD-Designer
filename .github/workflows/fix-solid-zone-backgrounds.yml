name: Fix solid print-zone background fills
on:
  push:
    paths:
      - '.github/workflows/fix-solid-zone-backgrounds.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make colored zone backgrounds solid inside production outlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()
          old='  let head=0,tail=0;'
          new="  let barrier=blocked;\n  for(let pass=0;pass<2;pass++){\n    const next=barrier.slice();\n    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){\n      const idx=y*w+x;\n      if(barrier[idx])continue;\n      if(barrier[idx-1]||barrier[idx+1]||barrier[idx-w]||barrier[idx+w]||barrier[idx-w-1]||barrier[idx-w+1]||barrier[idx+w-1]||barrier[idx+w+1])next[idx]=1;\n    }\n    barrier=next;\n  }\n  let head=0,tail=0;"
          assert old in s, 'template flood-fill start anchor missing'
          s=s.replace(old,new,1)
          old='outside[idx]||blocked[idx]'
          assert old in s, 'template flood-fill barrier anchor missing'
          s=s.replace(old,'outside[idx]||barrier[idx]',1)
          old='    if(!zoneHasContent(activeZone)){'
          new="    const solidBackground=(zoneState(activeZone).background||'#FFFFFF').toUpperCase()!=='#FFFFFF';\n    if(!solidBackground&&!zoneHasContent(activeZone)){"
          assert old in s, 'editor helper-art anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify targeted patch
        run: |
          node --check v20/editor.js
          grep -q 'let barrier=blocked' v20/editor.js
          grep -q 'outside\[idx\]||barrier\[idx\]' v20/editor.js
          grep -q 'const solidBackground=' v20/editor.js
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-solid-zone-backgrounds.yml
          git add v20/editor.js
          git commit -m 'Make colored print zones solid in 2D editor'
          git push origin main
