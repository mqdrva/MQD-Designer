name: Replace buildTemplateMask implementation
on:
  push:
    paths:
      - '.github/workflows/replace-template-mask.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace buildTemplateMask
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('v20/editor.js')
          s=p.read_text()
          new_func=base64.b64decode(' GNvbm5lY3RlZCBvdXRsaW5lIGNvbXBvbmVudC4KICA=').decode()
          PY
