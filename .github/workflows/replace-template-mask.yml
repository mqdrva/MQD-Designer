name: Replace buildTemplateMask implementation
on:
  push:
    paths:
      - '.github/workflows/replace-template-mask.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace buildTemplateMask
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('v20/editor.js')
          s=p.read_text()
          new_func=base64.b64decode('').decode()
          pattern=r"function buildTemplateMask\(img\)\{.*?\n\}\nfunction scaleBounds"
          repl=new_func+"\nfunction scaleBounds"
          s2,n=re.subn(pattern,lambda m: repl,s,count=1,flags=re.S)
          assert n==1, f'buildTemplateMask replacement count was {n}'
          p.write_text(s2)
          PY
      - name: Verify syntax
        run: |
          node --check v20/editor.js
          grep -q 'Build the fill mask from the LARGEST connected outline component' v20/editor.js
      - name: Commit replacement and remove workflow
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/replace-template-mask.yml
          git add v20/editor.js
          git commit -m 'Replace template mask with sleeve silhouette fill logic'
          git push origin main
