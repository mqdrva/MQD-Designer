name: Run zone layer editor v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-zone-layer-editor-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Adjust patch script initializer
        run: python -c "from pathlib import Path; p=Path('.github/scripts/patch_zone_editor.py'); s=p.read_text(); s=s.replace(\"init_anchor = 'renderCatalog();renderZones();renderSwatches();updateStats();loadGarment();'\", \"init_anchor = 'renderCatalog();renderZones();renderSwatches();updateStats();selectProduct(product.id);'\"); s=s.replace(\"'bindLayerControls();ensureZoneState();renderCatalog();renderZones();renderSwatches();renderLayerEditor();updateStats();loadGarment();'\", \"'bindLayerControls();ensureZoneState();renderCatalog();renderZones();renderSwatches();renderLayerEditor();updateStats();selectProduct(product.id);'\"); p.write_text(s)"
      - name: Patch zone/layer editor
        run: python .github/scripts/patch_zone_editor.py
      - name: Commit editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add per-zone artwork layers and controls"
          git push origin main
