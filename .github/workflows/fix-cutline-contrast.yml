name: Keep production cutlines visible on every color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cutline-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add contrast halo under production cutlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()
          old="""    if(rec.cutlineCanvas){
      targetCtx.save();
      targetCtx.globalAlpha=1;
      targetCtx.globalCompositeOperation='source-over';
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }
"""
          new="""    if(rec.cutlineCanvas){
      targetCtx.save();
      targetCtx.globalAlpha=1;
      targetCtx.globalCompositeOperation='source-over';
      // Keep the production red cut/sew line visible even when the customer
      // chooses red (or another similar color) for the printable background.
      // A thin white halo sits underneath; the actual cutline remains true red.
      targetCtx.shadowColor='rgba(255,255,255,.98)';
      targetCtx.shadowBlur=5;
      targetCtx.shadowOffsetX=0;
      targetCtx.shadowOffsetY=0;
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.shadowBlur=0;
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }
"""
          if old not in s:
              raise SystemExit('Cutline draw block not found; no files changed')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax check
        run: node --check v20/editor.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v20/editor.js
          git commit -m 'Keep 2D production cutlines visible on all colors'
          git push origin main
