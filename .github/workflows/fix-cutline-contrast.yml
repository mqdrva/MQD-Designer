name: Fix Cutline Contrast
on:
  push:
    paths:
      - '.github/workflows/fix-cutline-contrast.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch editor cutlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/editor.js')
          s=p.read_text()
          old="""    if(rec.cutlineCanvas){
      targetCtx.save();
      targetCtx.globalAlpha=1;
      targetCtx.globalCompositeOperation='source-over';
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }
"""
          new="""    if(rec.cutlineCanvas){
      targetCtx.save();
      targetCtx.globalAlpha=1;
      targetCtx.globalCompositeOperation='source-over';
      targetCtx.shadowColor='rgba(255,255,255,.98)';
      targetCtx.shadowBlur=5;
      targetCtx.shadowOffsetX=0;
      targetCtx.shadowOffsetY=0;
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.shadowBlur=0;
      targetCtx.drawImage(rec.cutlineCanvas,r.x,r.y,r.w,r.h);
      targetCtx.restore();
    }
"""
          assert old in s, 'cutline draw block missing'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify syntax
        run: node --check v20/editor.js
      - name: Commit patch
        run: |
          git config user.name 'MQD Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add v20/editor.js
          git commit -m 'Keep 2D production cutlines visible on all colors'
          git push origin main
