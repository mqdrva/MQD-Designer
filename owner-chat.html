<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>MQD Support Inbox</title><link rel="stylesheet" href="/v20/help-chat.css"><style>body{margin:0;background:#f6f6f6;color:#222;font:15px system-ui}header,main{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between}a{color:#a84400}#inbox{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}#conversations{display:grid;gap:8px;align-content:start}button{font:inherit;cursor:pointer;padding:10px;border:1px solid #ccc;border-radius:8px;background:white;color:#222}#conversation{height:70vh;min-height:400px;border:1px solid #ddd;border-radius:12px}#conversation[hidden],#inbox[hidden]{display:none}#conversations button{text-align:left;overflow-wrap:anywhere}#conversations button[aria-current=true]{border-color:#ff6b00;background:#fff0e5}@media(max-width:700px){#inbox{grid-template-columns:1fr}#conversations{max-height:220px;overflow:auto}header,main{padding:12px}}</style></head><body><header><strong>MQD Support Inbox</strong><a href="/owner/">Owner portal</a></header><main><h1>Customer conversations</h1><p>Asynchronous human support. Customers see your replies in their original chat tab.</p><p id="status" role="status">Checking secure owner access…</p><a id="signIn" href="/owner/" hidden>Sign in securely</a><div id="inbox" hidden><aside><div id="conversations"></div><button id="previous" type="button">Previous</button> <button id="next" type="button">More</button><button id="refresh" type="button">Refresh inbox</button></aside><section id="conversation" class="mqd-support" hidden><h2 id="heading">Conversation</h2><div id="messages" class="mqd-support-messages" role="log" aria-label="Customer conversation"></div><p id="notification" role="status" class="mqd-support-status"></p><button id="retry" type="button">Retry pending email alert</button><form id="reply" class="mqd-support-form"><textarea name="message" maxlength="2000" required rows="2" aria-label="Reply to customer" placeholder="Reply as MQD"></textarea><button type="submit">Send reply</button></form></section></div></main><script type="module" src="/v20/owner-chat.js"></script></body></html>
